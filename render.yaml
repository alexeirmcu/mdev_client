services:
  - type: web
    name: stp-server
    env: node
    region: oregon
    plan: free
    branch: main
    autoDeploy: true
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health

  - type: web
    name: stp-client
    env: static
    branch: main
    autoDeploy: true
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
